name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java (required for Android SDK)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      - name: Restore NuGet packages
        run: dotnet restore src/EnglishPractice.Mobile/EnglishPractice.Mobile.csproj

      - name: Build Android APK (Debug)
        run: |
          dotnet build src/EnglishPractice.Mobile/EnglishPractice.Mobile.csproj \
            -f net9.0-android \
            -c Debug \
            -p:AndroidKeyStore=false

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPractice-Android-Debug-APK
          path: src/EnglishPractice.Mobile/bin/Debug/net9.0-android/*.apk
          retention-days: 30
