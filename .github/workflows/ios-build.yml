name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:        # cho phép chạy thủ công từ GitHub UI

jobs:
  build-ios:
    runs-on: macos-15       # Xcode 16, iOS 18 SDK

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. .NET 9 ────────────────────────────────────────────────
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ── 3. MAUI workload ─────────────────────────────────────────
      - name: Install MAUI workload
        run: dotnet workload install maui-ios --skip-sign-check

      # ── 4. Restore ───────────────────────────────────────────────
      - name: Restore NuGet packages
        run: dotnet restore src/EnglishPractice.Mobile/EnglishPractice.Mobile.csproj

      # ── 5. Build iOS (simulator — không cần Apple certificate) ───
      #    Tạo ra file .app chạy được trên iOS Simulator
      - name: Build iOS Simulator
        run: |
          dotnet build src/EnglishPractice.Mobile/EnglishPractice.Mobile.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=iossimulator-x64 \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false \
            -p:BuildIpa=false

      # ── 6. Upload .app artifact ───────────────────────────────────
      - name: Upload iOS Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPractice-iOS-Simulator
          path: src/EnglishPractice.Mobile/bin/Release/net9.0-ios/iossimulator-x64/*.app
          retention-days: 30

  # ── Job riêng: build IPA thật (cần Apple certificate) ──────────
  build-ipa:
    runs-on: macos-15
    # Chỉ chạy khi có đủ secrets — bỏ comment if: sau khi setup certificate
    if: >
      github.event_name == 'workflow_dispatch' &&
      secrets.APPLE_CERTIFICATE_BASE64 != ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui-ios --skip-sign-check

      # Import certificate từ GitHub Secret
      - name: Import Apple Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: temp-keychain-password
        run: |
          CERT_PATH=$RUNNER_TEMP/apple_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app.keychain

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # Import provisioning profile
      - name: Import Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Restore NuGet packages
        run: dotnet restore src/EnglishPractice.Mobile/EnglishPractice.Mobile.csproj

      # Build IPA thật — chạy được trên thiết bị thật
      - name: Build IPA
        env:
          CODESIGN_KEY: ${{ secrets.APPLE_CODESIGN_KEY }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}
        run: |
          dotnet publish src/EnglishPractice.Mobile/EnglishPractice.Mobile.csproj \
            -f net9.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="$CODESIGN_KEY" \
            -p:CodesignProvision="$PROVISIONING_PROFILE_NAME" \
            -p:BuildIpa=true \
            -p:ArchiveOnBuild=true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EnglishPractice-iOS-IPA
          path: |
            src/EnglishPractice.Mobile/bin/Release/net9.0-ios/ios-arm64/publish/*.ipa
          retention-days: 30
